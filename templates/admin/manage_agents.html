{% extends 'admin/base.html' %}

{% block title %}Manage Agents{% endblock %}

{% block content %}
    <h1>Manage Agents</h1>
    <h2>Add New Agent</h2>
    <form method="post" action="{{ url_for('add_agent') }}">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>

        <input type="submit" value="Add Agent">
    </form>

    <hr>

    <h2>Existing Agents</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for agent in agents %}
                <tr>
                    <td>{{ agent.name }}</td>
                    <td>{{ agent.email }}</td>
                    <td>
                        <form method="post" action="{{ url_for('delete_agent', user_id=agent.id) }}" style="display:inline;">
                            <input type="submit" value="Delete" onclick="return confirm('Are you sure you want to delete this agent?');">
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="2">No agents found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
